<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>toomuch wasm</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap");
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #050508;
        overflow: hidden;
        color: #f2f4ff;
        font:
          14px ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #editor {
        position: fixed;
        left: 16px;
        top: 16px;
        width: min(520px, calc(100vw - 32px));
        height: calc(100vh - 32px);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        background: rgba(5, 5, 8, 0.86);
        border: 1px solid rgba(242, 244, 255, 0.1);
        border-radius: 8px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      #editor.collapsed {
        height: auto;
        opacity: 80%;
      }

      #editor-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        font-family: "JetBrains Mono", monospace;
      }

      #editor-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        opacity: 0.45;
      }

      #editor-content {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-rows: auto auto 1fr auto auto 1fr auto 1fr auto auto;
        gap: 10px;
      }

      #editor.collapsed #editor-content {
        display: none;
      }

      label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.07em;
        opacity: 0.55;
      }

      textarea {
        min-height: 0;
        resize: none;
        border: 1px solid rgba(242, 244, 255, 0.15);
        border-radius: 5px;
        background: rgba(10, 10, 10, 0.4);
        color: #f2f4ff;
        padding: 10px 12px;
        font: inherit;
        outline: none;
        tab-size: 2;
        transition: border-color 0.15s;
      }

      textarea:focus {
        border-color: rgba(242, 244, 255, 0.45);
      }

      .btn {
        border-radius: 5px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 0.15s,
          opacity 0.15s;
      }

      #render {
        margin-top: 0.2rem;
        width: max-content;
        border: none;
        background: #f2f4ff;
        color: #050508;
        padding: 8px 17px;
        width: 100%;
      }

      #render:hover {
        background: #fff;
      }

      #toggle-btn {
        border: 1px solid rgba(242, 244, 255, 0.25);
        background: transparent;
        color: rgba(242, 244, 255, 0.7);
        padding: 4px 10px;
        font-size: 12px;
      }

      #toggle-btn:hover {
        background: rgba(242, 244, 255, 0.08);
        color: #f2f4ff;
      }

      #error {
        min-height: 1.2em;
        margin: 0;
        font-size: 12px;
        color: #ff8f8f;
        white-space: pre-wrap;
      }

      .preset-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: -2px;
      }

      .preset-btn {
        border: 1px solid rgba(242, 244, 255, 0.18);
        background: transparent;
        color: rgba(242, 244, 255, 0.55);
        padding: 2px 8px;
        font-size: 10px;
        letter-spacing: 0.06em;
        border-radius: 3px;
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
      }

      .preset-btn:hover {
        background: rgba(242, 244, 255, 0.08);
        color: #f2f4ff;
      }
    </style>
  </head>
  <body>
    <canvas id="toomuch"></canvas>
    <section id="editor">
      <div id="editor-header">
        <span id="editor-title">shader editor</span>
        <button id="toggle-btn" class="btn">hide</button>
      </div>
      <div id="editor-content">
        <label for="bg-shader">background.glsl</label>
        <div class="preset-bar" data-target="bg-shader">
          <button class="preset-btn" data-src="./shaders/bg/metaballs.glsl">metaballs</button>
          <button class="preset-btn" data-src="./shaders/bg/galaxy.glsl">galaxy</button>
          <button class="preset-btn" data-src="./shaders/bg/shane.glsl">shane</button>
          <button class="preset-btn" data-src="./shaders/bg/danilo.glsl">danilo</button>
          <button class="preset-btn" data-src="./shaders/bg/protean.glsl">protean</button>
        </div>
        <textarea id="bg-shader" spellcheck="false" placeholder="// built-in"></textarea>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <label for="effect-shader">effect.glsl</label>
          <button id="effect-toggle" class="preset-btn" style="font-size:10px;opacity:0.4;">disabled</button>
        </div>
        <div class="preset-bar" data-target="effect-shader">
          <button class="preset-btn" data-src="./shaders/effect/ascii.glsl">ascii</button>
          <button class="preset-btn" data-src="./shaders/effect/kuwahara.glsl">kuwahara</button>
        </div>
        <textarea id="effect-shader" spellcheck="false" placeholder="// none"></textarea>
        <label for="post-shader">postproc.glsl</label>
        <textarea id="post-shader" spellcheck="false" placeholder="// built-in CRT"></textarea>
        <button id="render" class="btn" type="button">Render</button>
        <pre id="error"></pre>
      </div>
    </section>
    <script type="module">
      import init, { start } from "./pkg/toomuch.js";


      const bgShader = document.getElementById("bg-shader");
      const effectShader = document.getElementById("effect-shader");
      const postShader = document.getElementById("post-shader");
      const render = document.getElementById("render");
      const error = document.getElementById("error");
      const editor = document.getElementById("editor");
      const toggleBtn = document.getElementById("toggle-btn");

      bgShader.value = "";
      effectShader.value = "";
      postShader.value = "";

      for (const ta of [bgShader, effectShader, postShader]) {
        ta.addEventListener("keydown", (event) => event.stopPropagation());
        ta.addEventListener("input", () => { presetSrc[ta.id] = null; });
      }

      toggleBtn.addEventListener("click", () => {
        const collapsed = editor.classList.toggle("collapsed");
        toggleBtn.textContent = collapsed ? "show" : "hide";
      });

      let effectEnabled = false;

      const effectToggle = document.getElementById("effect-toggle");
      effectToggle.addEventListener("click", () => {
        effectEnabled = !effectEnabled;
        effectToggle.textContent = effectEnabled ? "enabled" : "disabled";
        effectToggle.style.opacity = effectEnabled ? "" : "0.4";
        encodeState();
      });

      const b64enc = (s) => btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
      const b64dec = (s) => atob(s.replace(/-/g, "+").replace(/_/g, "/"));

      // tracks active preset path per textarea id; null means custom content
      const presetSrc = { "bg-shader": null, "effect-shader": null, "post-shader": null };

      function encodeState() {
        const params = new URLSearchParams();
        const enc = (id, key, val) => {
          if (!val.trim()) return;
          params.set(key, presetSrc[id] ? "p:" + presetSrc[id] : b64enc(val));
        };
        enc("bg-shader",     "bg",     bgShader.value);
        enc("effect-shader", "effect", effectShader.value);
        enc("post-shader",   "post",   postShader.value);
        if (effectEnabled) params.set("fx", "1");
        history.replaceState(null, "", "?" + params.toString());
      }

      async function decodeState() {
        const params = new URLSearchParams(location.search);
        const dec = async (key, el, id) => {
          if (!params.has(key)) return;
          const val = params.get(key);
          if (val.startsWith("p:")) {
            const path = val.slice(2);
            presetSrc[id] = path;
            el.value = await fetch(path).then((r) => r.text());
          } else {
            el.value = b64dec(val);
          }
        };
        await dec("bg",     bgShader,     "bg-shader");
        await dec("effect", effectShader, "effect-shader");
        await dec("post",   postShader,   "post-shader");
        if (params.has("fx")) {
          effectEnabled = params.get("fx") === "1";
          effectToggle.textContent = effectEnabled ? "enabled" : "disabled";
          effectToggle.style.opacity = effectEnabled ? "" : "0.4";
        }
      }

      await decodeState();

      function buildConfig(bg, effect, post) {
        const bgLine     = bg.trim()   ? `shader = ${JSON.stringify(bg)}\n`   : "";
        const postLine   = post.trim() ? `shader = ${JSON.stringify(post)}\n` : "";
        const effectSection = effectEnabled && effect.trim()
          ? `\n[background.effect]\nshader = ${JSON.stringify(effect)}\n`
          : "";
        return `
[input]
font_size = 72

[background]
${bgLine}${effectSection}
[post]
${postLine}`;
      }

      document.querySelectorAll(".preset-bar").forEach((bar) => {
        const targetId = bar.dataset.target;
        bar.querySelectorAll(".preset-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            try {
              const src = await fetch(btn.dataset.src).then((r) => r.text());
              document.getElementById(targetId).value = src;
              presetSrc[targetId] = btn.dataset.src;
            } catch (e) {
              console.error("failed to load preset:", e);
            }
          });
        });
      });

      try {
        await init();
        window.toomuch = start(
          "toomuch",
          buildConfig(bgShader.value, effectShader.value, postShader.value),
        );

        const ro = new ResizeObserver(() => {
          try { window.toomuch.resize(); } catch (e) { console.error(e); }
        });
        ro.observe(document.getElementById("toomuch"));

        render.addEventListener("click", () => {
          try {
            window.toomuch.reload_config(
              buildConfig(bgShader.value, effectShader.value, postShader.value),
            );
            encodeState();
            error.textContent = "";
          } catch (renderError) {
            error.textContent = renderError?.stack || String(renderError);
          }
        });
      } catch (err) {
        document.getElementById("error").textContent =
          err?.stack || String(err);
        throw err;
      }
    </script>
  </body>
</html>
